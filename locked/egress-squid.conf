# Locked profile: outbound proxy for the agents (logs go to /var/log/squid, which the image echoes to docker logs). It allows only the domains in egress-allowlist.txt (empty = none).
# The agents' network has no other way out, so a client that ignores HTTP(S)_PROXY simply gets no connection.
http_port 3128
acl allowlist dstdomain "/etc/squid/acp/egress-allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all
cache deny all
pid_filename none
