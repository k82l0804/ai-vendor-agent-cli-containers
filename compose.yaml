name: acp

# Every agent: long-running container; each `docker exec -i acp-<agent> acp-run` is one fresh ACP connection.
# Run it through bin/acp-compose (the Makefile does), which picks Docker or Podman.
# Bind mounts carry :z, the SELinux shared label (needed on hosts with SELinux enforcing, ignored elsewhere).
x-agent: &agent
  init: true
  # Podman only (bin/acp-compose sets ACP_USERNS=keep-id): your UID maps into the container unchanged, so workspace
  # files stay yours under rootless Podman. Empty under Docker, which changes nothing.
  userns_mode: ${ACP_USERNS:-}
  restart: unless-stopped
  tmpfs:
    - /tmp:exec,mode=1777,size=4g
  environment:
    WORKSPACE: ${WORKSPACE:-${HOME}/workarea/tmp}
  volumes:
    - ${WORKSPACE:-${HOME}/workarea/tmp}:${WORKSPACE:-${HOME}/workarea/tmp}:z

x-proxy-env: &proxy-env
  WORKSPACE: ${WORKSPACE:-${HOME}/workarea/tmp}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
  LLM_PROXY_URL: http://llm-proxy:8000

services:
  claude:
    <<: *agent
    image: acp-claude
    container_name: acp-claude
    build: { context: docker/claude, args: { BASE: acp-base } }
    environment:
      WORKSPACE: ${WORKSPACE:-${HOME}/workarea/tmp}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

  codex:
    <<: *agent
    image: acp-codex
    container_name: acp-codex
    build: { context: docker/codex, args: { BASE: acp-base } }
    volumes:
      - ${WORKSPACE:-${HOME}/workarea/tmp}:${WORKSPACE:-${HOME}/workarea/tmp}:z
      - ${HOME}/.codex:/creds/codex:ro,z

  grok:
    <<: *agent
    image: acp-grok
    container_name: acp-grok
    build: { context: docker/grok, args: { BASE: acp-base } }
    volumes:
      - ${WORKSPACE:-${HOME}/workarea/tmp}:${WORKSPACE:-${HOME}/workarea/tmp}:z
      - ${HOME}/.grok:/creds/grok:ro,z

  agy:
    <<: *agent
    image: acp-agy
    container_name: acp-agy
    build: { context: docker/agy, args: { BASE: acp-base } }
    environment:
      WORKSPACE: ${WORKSPACE:-${HOME}/workarea/tmp}
      AGY_AUTH: subscription
      # The server's own default on a Google sign-in is gemini-3.8-flash-high.
      AGY_ACP_DEFAULT_MODEL: ${AGY_MODEL:-gemini-4-argon-high}
    volumes:
      - ${WORKSPACE:-${HOME}/workarea/tmp}:${WORKSPACE:-${HOME}/workarea/tmp}:z
      - ${HOME}/.gemini:/creds/agy:ro,z

  muse:
    <<: *agent
    image: acp-muse
    container_name: acp-muse
    build: { context: docker/muse, args: { BASE: acp-base } }
    environment:
      WORKSPACE: ${WORKSPACE:-${HOME}/workarea/tmp}
      MUSE_MODEL: ${MUSE_MODEL:-}
    volumes:
      - ${WORKSPACE:-${HOME}/workarea/tmp}:${WORKSPACE:-${HOME}/workarea/tmp}:z
      - ${HOME}/.config/muse:/creds/muse:ro,z

  # ---- agents whose model comes from the local LiteLLM proxy (~/workarea/openai-proxy) ----

  claude-proxy:
    <<: *agent
    image: acp-claude
    container_name: acp-claude-proxy
    environment:
      <<: *proxy-env
      CLAUDE_AUTH: proxy
      CLAUDE_PROXY_MODEL: ${CLAUDE_PROXY_MODEL:-nemotron-3-ultra}
    networks: [default, llm-proxy]

  codex-proxy:
    <<: *agent
    image: acp-codex
    container_name: acp-codex-proxy
    environment:
      <<: *proxy-env
      CODEX_AUTH: proxy
      CODEX_PROXY_MODEL: ${CODEX_PROXY_MODEL:-nemotron-3-ultra}
    networks: [default, llm-proxy]

  grok-proxy:
    <<: *agent
    image: acp-grok
    container_name: acp-grok-proxy
    environment:
      <<: *proxy-env
      GROK_AUTH: proxy
      GROK_PROXY_MODEL: ${GROK_PROXY_MODEL:-nemotron-3-ultra}
      GROK_PROXY_CONTEXT_WINDOW: ${GROK_PROXY_CONTEXT_WINDOW:-}
    networks: [default, llm-proxy]

  agy-proxy:
    <<: *agent
    image: acp-agy
    container_name: acp-agy-proxy
    environment:
      <<: *proxy-env
      AGY_AUTH: proxy
    networks: [default, llm-proxy]

  opencode:
    <<: *agent
    image: acp-opencode
    container_name: acp-opencode
    build: { context: docker/opencode, args: { BASE: acp-base } }
    environment:
      <<: *proxy-env
      OPENCODE_MODEL: ${OPENCODE_MODEL:-nemotron-3-ultra}
    networks: [default, llm-proxy]

  kilo:
    <<: *agent
    image: acp-kilo
    container_name: acp-kilo
    build: { context: docker/kilo, args: { BASE: acp-base } }
    environment:
      <<: *proxy-env
      KILO_MODEL: ${KILO_MODEL:-nemotron-3-ultra}
    networks: [default, llm-proxy]

  goose:
    <<: *agent
    image: acp-goose
    container_name: acp-goose
    build: { context: docker/goose, args: { BASE: acp-base } }
    environment:
      <<: *proxy-env
      GOOSE_MODEL: ${GOOSE_MODEL:-nemotron-3-ultra}
    networks: [default, llm-proxy]

networks:
  llm-proxy:
    name: ${LLM_PROXY_NETWORK:-openai-proxy_default}
    external: true
